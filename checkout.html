<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="翔安富文具｜填寫訂單與超商取件資料">
<meta name="theme-color" content="#f7f7f4"><title>填寫結帳資料｜翔安富文具</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="checkout-page.css">
</head>
<body class="checkout-page">
<header class="site-header">
 <a class="brand" href="index.html"><span class="brand-mark site-logo-mark">翔</span><span class="brand-copy"><strong>翔安富文具</strong><small>STATIONERY & DAILY GOODS</small></span></a>
 <a class="back-link" href="index.html">← 返回商品頁</a>
</header>
<main class="checkout-main">
 <div class="checkout-heading"><p class="eyebrow">SECURE YOUR ORDER</p><h1>填寫結帳資料</h1><p>請確認選購商品，並填寫收件與超商取件資訊。</p></div>
 <div class="checkout-layout">
  <section class="checkout-panel">
   <h2>收件與取件資料</h2>
   <form id="checkout-form" class="checkout-form">
    <label>取件人姓名（2–10字）<input name="recipient" required minlength="2" maxlength="10" autocomplete="name"></label>
    <label>取件人手機（10碼）<input name="phone" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="tel"></label>
    <label>取件門市店號（6碼）<input name="storeId" id="store-id" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="請輸入6碼店號"></label>
    <label>配送溫層<select name="temperature"><option value="常溫">常溫</option><option value="冷凍">冷凍</option></select></label>
    <label>運費金額（元）<input name="shippingFee" type="number" min="0" max="100" value="38" required></label>
    <label>商品備註<textarea name="note" maxlength="200" rows="3"></textarea></label>
    <label>其他資訊（FB／LINE／IG，可不填）<input name="social" maxlength="200"></label>
    <p class="checkout-status" id="checkout-status" role="status" aria-live="polite"></p>
    <button class="checkout-submit" id="checkout-submit" type="submit">確認送出訂單</button>
   </form>
  </section>
  <aside class="checkout-panel order-panel">
   <h2>訂單摘要</h2><div id="checkout-items" class="checkout-items"><p>正在載入商品…</p></div>
   <div class="summary-row"><span>商品小計</span><strong id="checkout-subtotal">NT$ 0</strong></div>
   <div class="summary-row"><span>運費</span><strong id="checkout-shipping">NT$ 38</strong></div>
   <div class="summary-row grand-total"><span>應付代收金額</span><strong id="checkout-grand-total">NT$ 38</strong></div>
   <p class="summary-note">送出後系統會將訂單資料傳送至店家的 Google 試算表。請留意訂單完成頁的訂單編號。</p>
  </aside>
 </div>
</main>
<footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark site-logo-mark">翔</span><span class="brand-copy"><strong>翔安富文具</strong><small>STATIONERY & DAILY GOODS</small></span></a><p>© <span id="year"></span> 翔安富文具. All rights reserved.</p></footer>
<script src="checkout-config.js"></script><script src="checkout.js"></script>
</body></html>
